<svg xmlns="http://www.w3.org/2000/svg" width="1883" height="1531" viewBox="0 0 1883 1531" role="img" aria-labelledby="title desc">
<title id="title">QUACS ACI feedback: proposed coupling interfaces</title>
<desc id="desc">Host and aerosol inputs feed activation diagnostics, supported droplet source, Morrison microphysics, and separate aerosol number and mass coupling. The host applies returned tendencies once per time step.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#333333"/></marker></defs>
<g id="canvas">
<rect x="0.0" y="0.0" width="1883.0" height="1531.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/>
</g>
<g id="title">
<rect x="70.0" y="15.0" width="1740.0" height="55.0" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="70.0" y="51.14" text-anchor="start" font-family="Arial, sans-serif" font-size="32.0" fill="#0B1F3A">
<tspan x="70.0" dy="0">
<tspan font-weight="700">QUACS ACI feedback</tspan>
</tspan>
</text>
</g>
<g id="subtitle">
<rect x="800.0" y="22.0" width="1010.0" height="40.0" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="1810.0" y="47.67" text-anchor="end" font-family="Arial, sans-serif" font-size="21.0" fill="#5E6C84">
<tspan x="1810.0" dy="0">
<tspan font-weight="400">Proposed interfaces · implementation and validation pending</tspan>
</tspan>
</text>
</g>
<g id="host">
<rect x="70.0" y="90.0" width="1070.0" height="235.0" rx="18.8" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="605.0" y="132.64" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.0" fill="#333333">
<tspan x="605.0" dy="0">
<tspan font-weight="700">Host model</tspan>
</tspan>
</text>
</g>
<g id="host_thermo">
<rect x="100.0" y="155.0" width="580.0" height="140.0" rx="11.2" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/>
<text x="390.0" y="202.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.0" fill="#333333">
<tspan x="390.0" dy="0">
<tspan font-weight="700">Thermodynamic / dynamic state</tspan>
</tspan>
<tspan x="390.0" dy="29.28">
<tspan font-weight="400">Input: T, p / ρ, qv, w</tspan>
</tspan>
<tspan x="390.0" dy="29.28">
<tspan font-weight="400">Pass standardized state to ACI</tspan>
</tspan>
</text>
</g>
<g id="host_cloud">
<rect x="715.0" y="155.0" width="395.0" height="140.0" rx="11.2" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/>
<text x="912.5" y="203.15" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.0" fill="#333333">
<tspan x="912.5" dy="0">
<tspan font-weight="700">Cloud state + time step</tspan>
</tspan>
<tspan x="912.5" dy="28.06">
<tspan font-weight="400">Existing cloud mass / number</tspan>
</tspan>
<tspan x="912.5" dy="28.06">
<tspan font-weight="400">Δt + caller conventions</tspan>
</tspan>
</text>
</g>
<g id="aerosol_module">
<rect x="1220.0" y="90.0" width="590.0" height="235.0" rx="18.8" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
<text x="1515.0" y="168.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.0" fill="#333333">
<tspan x="1515.0" dy="0">
<tspan font-weight="700">Aerosol module</tspan>
</tspan>
<tspan x="1515.0" dy="30.5">
<tspan font-weight="400">Input: N, dry size, σg, κ</tspan>
</tspan>
<tspan x="1515.0" dy="30.5">
<tspan font-weight="400">Number / mass + reservoir state</tspan>
</tspan>
<tspan x="1515.0" dy="30.5">
<tspan font-weight="400">Output: modal / bin properties to ACI</tspan>
</tspan>
</text>
</g>
<g id="outer">
<rect x="70.0" y="355.0" width="1740.0" height="950.0" rx="76.0" fill="#f5f5f5" stroke="#666666" stroke-width="2"/>
</g>
<g id="step1">
<rect x="110.0" y="395.0" width="1020.0" height="230.0" rx="18.4" fill="#F4F8FF" stroke="#1B4D89" stroke-width="2"/>
<text x="126.0" y="435.88" text-anchor="start" font-family="Arial, sans-serif" font-size="26.0" fill="#0B1F3A">
<tspan x="126.0" dy="0">
<tspan font-weight="700">Step 1: ACI activation</tspan>
</tspan>
</text>
</g>
<g id="adapters">
<rect x="145.0" y="475.0" width="270.0" height="125.0" rx="7.5" fill="#FFFFFF" stroke="#5E6C84" stroke-width="1.5"/>
<text x="280.0" y="506.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0" fill="#172B4D">
<tspan x="280.0" dy="0">
<tspan font-weight="700">Input adapters</tspan>
</tspan>
<tspan x="280.0" dy="24.4">
<tspan font-weight="400">Host + aerosol state</tspan>
</tspan>
<tspan x="280.0" dy="24.4">
<tspan font-weight="400">Units, bounds, modes</tspan>
</tspan>
<tspan x="280.0" dy="24.4">
<tspan font-weight="400">Output: properties / state</tspan>
</tspan>
</text>
</g>
<g id="supersaturation">
<rect x="450.0" y="475.0" width="315.0" height="125.0" rx="7.5" fill="#FFFFFF" stroke="#5E6C84" stroke-width="1.5"/>
<text x="607.5" y="503.18" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0" fill="#172B4D">
<tspan x="607.5" dy="0">
<tspan font-weight="700">Supersaturation</tspan>
</tspan>
<tspan x="607.5" dy="26.84">
<tspan font-weight="400">T, p / ρ, qv, w</tspan>
</tspan>
<tspan x="607.5" dy="26.84">
<tspan font-weight="400">+ aerosol distribution</tspan>
</tspan>
<tspan x="607.5" dy="26.84">
<tspan font-weight="400">Output: Smax</tspan>
</tspan>
</text>
</g>
<g id="activation">
<rect x="800.0" y="475.0" width="295.0" height="125.0" rx="7.5" fill="#FFFFFF" stroke="#5E6C84" stroke-width="1.5"/>
<text x="947.5" y="503.18" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0" fill="#172B4D">
<tspan x="947.5" dy="0">
<tspan font-weight="700">Activation result</tspan>
</tspan>
<tspan x="947.5" dy="26.84">
<tspan font-weight="400">Smax + aerosol properties</tspan>
</tspan>
<tspan x="947.5" dy="26.84">
<tspan font-weight="400">Output: Nact</tspan>
</tspan>
<tspan x="947.5" dy="26.84">
<tspan font-weight="400">+ activated fractions</tspan>
</tspan>
</text>
</g>
<g id="activation_output">
<rect x="230.0" y="650.0" width="780.0" height="65.0" rx="9.75" fill="#b0e3e6" stroke="#0e8088" stroke-width="1"/>
<text x="620.0" y="689.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.0" fill="#172B4D">
<tspan x="620.0" dy="0">
<tspan font-weight="700">Output: Smax, Nact, activated fractions</tspan>
</tspan>
</text>
</g>
<g id="step2">
<rect x="110.0" y="755.0" width="1020.0" height="215.0" rx="17.2" fill="#F4F8FF" stroke="#1B4D89" stroke-width="2"/>
<text x="126.0" y="795.88" text-anchor="start" font-family="Arial, sans-serif" font-size="26.0" fill="#0B1F3A">
<tspan x="126.0" dy="0">
<tspan font-weight="700">Step 2: Activation coupling</tspan>
</tspan>
</text>
</g>
<g id="droplet_source">
<rect x="145.0" y="825.0" width="950.0" height="120.0" rx="7.2" fill="#FFFFFF" stroke="#5E6C84" stroke-width="1.5"/>
<text x="620.0" y="850.6800000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0" fill="#172B4D">
<tspan x="620.0" dy="0">
<tspan font-weight="700">Supported droplet increment / source</tspan>
</tspan>
<tspan x="620.0" dy="26.84">
<tspan font-weight="400">Input: activation result, available aerosol, existing cloud state, Δt</tspan>
</tspan>
<tspan x="620.0" dy="26.84">
<tspan font-weight="400">Output: droplet source + paired aerosol number / mass transfer</tspan>
</tspan>
<tspan x="620.0" dy="26.84">
<tspan font-weight="400">Nact is a diagnostic; do not add it again each time step.</tspan>
</tspan>
</text>
</g>
<g id="source_output">
<rect x="230.0" y="985.0" width="780.0" height="55.0" rx="8.25" fill="#b0e3e6" stroke="#0e8088" stroke-width="1"/>
<text x="620.0" y="1018.71" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.0" fill="#172B4D">
<tspan x="620.0" dy="0">
<tspan font-weight="700">Output: cloud source + paired aerosol transfer</tspan>
</tspan>
</text>
</g>
<g id="step3">
<rect x="110.0" y="1080.0" width="1020.0" height="190.0" rx="15.2" fill="#F4F8FF" stroke="#1B4D89" stroke-width="2"/>
<text x="126.0" y="1120.88" text-anchor="start" font-family="Arial, sans-serif" font-size="26.0" fill="#0B1F3A">
<tspan x="126.0" dy="0">
<tspan font-weight="700">Step 3: Morrison microphysics (MP)</tspan>
</tspan>
</text>
</g>
<g id="mp">
<rect x="145.0" y="1150.0" width="950.0" height="95.0" rx="5.7" fill="#FFFFFF" stroke="#5E6C84" stroke-width="1.5"/>
<text x="620.0" y="1175.65" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.0" fill="#172B4D">
<tspan x="620.0" dy="0">
<tspan font-weight="700">Cloud response</tspan>
</tspan>
<tspan x="620.0" dy="28.06">
<tspan font-weight="400">Input: existing cloud state + supported droplet source</tspan>
</tspan>
<tspan x="620.0" dy="28.06">
<tspan font-weight="400">Output: cloud tendencies + precipitation / evaporation diagnostics</tspan>
</tspan>
</text>
</g>
<g id="aerosol_coupling">
<rect x="1220.0" y="650.0" width="540.0" height="620.0" rx="81.0" fill="#f9f7ed" stroke="#36393d" stroke-width="1"/>
<text x="1490.0" y="695.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.0" fill="#333333">
<tspan x="1490.0" dy="0">
<tspan font-weight="700">Aerosol coupling</tspan>
</tspan>
</text>
</g>
<g id="activation_transfer">
<rect x="1250.0" y="735.0" width="480.0" height="180.0" rx="10.8" fill="#FFFFFF" stroke="#5E6C84" stroke-width="1.5"/>
<text x="1490.0" y="777.26" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0" fill="#172B4D">
<tspan x="1490.0" dy="0">
<tspan font-weight="700">Activation transfer</tspan>
</tspan>
<tspan x="1490.0" dy="26.84">
<tspan font-weight="400">Input: paired activation number / mass</tspan>
</tspan>
<tspan x="1490.0" dy="26.84">
<tspan font-weight="400">Transfer available interstitial aerosol</tspan>
</tspan>
<tspan x="1490.0" dy="26.84">
<tspan font-weight="400">into the cloud-borne reservoir;</tspan>
</tspan>
<tspan x="1490.0" dy="26.84">
<tspan font-weight="400">match the supported droplet source.</tspan>
</tspan>
</text>
</g>
<g id="aerosol_pathways">
<rect x="1250.0" y="970.0" width="480.0" height="190.0" rx="11.4" fill="#FFFFFF" stroke="#5E6C84" stroke-width="1.5"/>
<text x="1490.0" y="1017.26" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0" fill="#172B4D">
<tspan x="1490.0" dy="0">
<tspan font-weight="700">Removal + return pathways</tspan>
</tspan>
<tspan x="1490.0" dy="26.84">
<tspan font-weight="400">Input: MP precipitation / evaporation</tspan>
</tspan>
<tspan x="1490.0" dy="26.84">
<tspan font-weight="400">+ aerosol reservoir state</tspan>
</tspan>
<tspan x="1490.0" dy="26.84">
<tspan font-weight="400">Output: depletion, removal, return</tspan>
</tspan>
<tspan x="1490.0" dy="26.84">
<tspan font-weight="400">under an explicit budget contract</tspan>
</tspan>
</text>
</g>
<g id="aerosol_output">
<rect x="1250.0" y="1190.0" width="480.0" height="55.0" rx="8.25" fill="#b0e3e6" stroke="#0e8088" stroke-width="1"/>
<text x="1490.0" y="1223.71" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.0" fill="#172B4D">
<tspan x="1490.0" dy="0">
<tspan font-weight="700">Output: aerosol tendencies</tspan>
</tspan>
</text>
</g>
<g id="reservoir_label">
<rect x="1460.0" y="400.0" width="280.0" height="60.0" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="1600.0" y="422.86" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.0" fill="#5E6C84">
<tspan x="1600.0" dy="0">
<tspan font-weight="400">Available aerosol +</tspan>
</tspan>
<tspan x="1600.0" dy="25.62">
<tspan font-weight="400">reservoir state</tspan>
</tspan>
</text>
</g>
<g id="legend">
<rect x="1220.0" y="500.0" width="540.0" height="100.0" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="1490.0" y="531.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0" fill="#5E6C84">
<tspan x="1490.0" dy="0">
<tspan font-weight="400">Solid arrows: activation / cloud path</tspan>
</tspan>
<tspan x="1490.0" dy="24.4">
<tspan font-weight="400">Dashed arrows: aerosol state / MP diagnostics</tspan>
</tspan>
<tspan x="1490.0" dy="24.4">
<tspan font-weight="400">MP diagnostics feed explicit aerosol coupling</tspan>
</tspan>
</text>
</g>
<g id="final_output">
<rect x="320.0" y="1345.0" width="1240.0" height="65.0" rx="9.75" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="940.0" y="1384.5200000000002" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.0" fill="#172B4D">
<tspan x="940.0" dy="0">
<tspan font-weight="700">Output: cloud tendencies + aerosol tendencies + diagnostics</tspan>
</tspan>
</text>
</g>
<g id="host_apply">
<rect x="540.0" y="1435.0" width="800.0" height="70.0" rx="5.6" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/>
<text x="940.0" y="1477.0200000000002" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.0" fill="#333333">
<tspan x="940.0" dy="0">
<tspan font-weight="700">Host applies returned tendencies once per time step</tspan>
</tspan>
</text>
</g>
<g id="footer">
<rect x="240.0" y="1510.0" width="1400.0" height="20.0" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text x="940.0" y="1524.5900000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0" fill="#5E6C84">
<tspan x="940.0" dy="0">
<tspan font-weight="400">Proposed coupling: kernels, units, reservoirs and budgets require validation.</tspan>
</tspan>
</text>
</g>
