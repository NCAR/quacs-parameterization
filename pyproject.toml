[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quacs-parameterization"
version = "0.1.0"
description = "Collecting python scripts that demonstrate and test quacs parameterizations"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "xarray>=2023.1",
    "scipy>=1.10",
    "netcdf4",
    "matplotlib",
    "musica",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "nbmake>=1.5",
    "ipykernel",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["quacs*"]

[tool.pytest.ini_options]
testpaths = ["tests", "quacs"]
addopts = "--nbmake"

[tool.ruff]
line-length = 100
target-version = "py39"
# These notebooks are the scientists' originals. Only their import lines and kernel are changed.
extend-exclude = [
    "quacs/drydep/wesely/examples/wesely_gas_drydep_SM.ipynb",
    "quacs/dust/ginoux/examples/musica_dust_ginoux_box_model.ipynb",
    "quacs/plumerise/freitas_pyrocb/examples/single_column_workflow_steps_original.ipynb",
    "quacs/tagged_tracers/voc_nox/examples/ex_tagged_co_musica_transport_core.ipynb",
    "quacs/vsls/cesm2_slh/examples/run_vsls_seasalt_original.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",  # line too long — handled by ruff format
]
